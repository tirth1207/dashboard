[package]
name = "lifeos_desktop_agent"
version = "1.0.0"
edition = "2021"

[lib]
name = "lifeos_desktop_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lifeos"], interval: 10s, timeout: 5s, retries: 5 }
  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    env_file: ../../.env
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  dashboard:
    build: { context: ../.., dockerfile: infra/docker/dashboard.Dockerfile }
    env_file: ../../.env
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
